name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: i18n Key Parity Check
        run: node scripts/check-i18n-keys.mjs

      - name: Server Tests
        run: npm test

      - name: Client Tests
        run: npm run test -w client --if-present

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
